# 3S · agente (Fase 6): cada ~10 minutos lee el canal #agente de Discord, contesta y, si se lo
# pidieron y confirmaron, corre, apaga o prende 3S. No instala nada: solo usa la biblioteca estándar.
name: 3S agente

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub puede demorar los disparos programados unos minutos
  workflow_dispatch:

permissions:
  contents: read
  actions: write             # solo para correr, apagar o prender el workflow "3S semanal"

concurrency:
  group: 3s-agente
  cancel-in-progress: false

jobs:
  agente:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Atender el canal #agente
        id: bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CANAL_AGENTE: ${{ secrets.DISCORD_CANAL_AGENTE || secrets.DISCORD_CANAL_CHARLA }}
          DISCORD_USUARIOS: ${{ secrets.DISCORD_USUARIOS }}
        run: python run.py --agente

      # Las acciones las ejecuta el workflow, no el agente: el agente solo puede elegir entre estas tres.
      - name: Apagar las corridas automáticas
        if: steps.bot.outputs.apagar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable semanal.yml

      - name: Prender las corridas automáticas
        if: steps.bot.outputs.encender == 'true' && steps.bot.outputs.apagar != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable semanal.yml

      - name: Correr 3S ahora
        if: steps.bot.outputs.correr == 'true' && steps.bot.outputs.apagar != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run semanal.yml

      - name: Avisar si algo falló
        if: failure()
        env:
          DISCORD_WEBHOOK_AVISOS: ${{ secrets.DISCORD_WEBHOOK_AVISOS }}
        run: python run.py --aviso "❌ 3S · el agente falló en esta vuelta. Detalle en GitHub Actions → 3S agente."
