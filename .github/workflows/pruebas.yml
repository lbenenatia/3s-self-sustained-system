# 3S · pruebas de cada cambio propuesto (pull request). Ningún cambio entra a producción sin pasarlas.
# No descarga fuentes: el catálogo del MI va a ~200 KB/s desde GitHub (383 MB ≈ 30+ min). Las pruebas
# usan la copia que deja la corrida semanal; las descargas en sí se prueban con un servidor local.
name: 3S pruebas

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"  # los mensajes de 3S aparecen en vivo en el log
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Las reglas de seguridad siguen selladas
        run: python src/s3/guardas.py
      - name: Pruebas de descargas (servidor local, sin internet)
        run: python tests/test_descargas.py
      - name: Pruebas de alertas (datos simulados, sin internet)
        run: python tests/test_alertas.py
      - name: Pruebas del agente (Discord falso, sin internet)
        run: python tests/test_agente.py
      - name: Restaurar datos de la última corrida semanal
        id: datos
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            state/descargas.json
          key: 3s-datos-
          restore-keys: 3s-datos-
      - name: Sin copia de datos todavía
        if: steps.datos.outputs.cache-matched-key == ''
        run: echo "::warning::No hay datos de una corrida semanal en caché. Se saltean las pruebas con datos reales; corré '3S semanal' una vez para generarlos."
      - name: Preparar datos (con la copia en caché, sin descargar)
        if: steps.datos.outputs.cache-matched-key != ''
        env:
          S3_SIN_DESCARGAS: "1"
        run: python run.py --solo-datos
      - name: Pruebas con datos reales
        if: steps.datos.outputs.cache-matched-key != ''
        run: |
          python tests/test_prospectivo.py
          python tests/test_territorio.py
