# 3S · latido diario: avisa por Discord (y Telegram) si hace más de 10 días que no hay una corrida exitosa
name: 3S latido

on:
  schedule:
    - cron: "43 13 * * *"    # todos los días 13:43 UTC = 10:43 en Uruguay
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latido:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"  # los mensajes de 3S aparecen en vivo en el log
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verificar latido
        env:
          DISCORD_WEBHOOK_AVISOS: ${{ secrets.DISCORD_WEBHOOK_AVISOS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py --latido
